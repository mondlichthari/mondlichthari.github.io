<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Minako 的主页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f9f9f9, #e0f7fa);
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #00796b;
      color: white;
      padding: 20px;
    }
    nav {
      margin: 15px 0;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #00796b;
      font-weight: bold;
    }
    section {
      padding: 40px;
    }
    footer {
      background-color: #004d40;
      color: white;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>欢迎来到 Minako 的主页</h1>
    <p>这是我的 GitHub Pages 个人网站</p>
  </header>
  <nav>
    <a href="#">主页</a>
    <a href="#">关于我</a>
    <a href="#">联系</a>
  </nav>
  <section>
    <h2>关于我</h2>
    <p>这里可以写你的介绍，比如兴趣爱好、项目经历或者学习方向。</p>
  </section>
  <footer>
    <p>© 2026 Minako | 使用 GitHub Pages 搭建</p>
  </footer>
</body>
</html>
